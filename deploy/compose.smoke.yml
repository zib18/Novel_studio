name: novel-deploy-smoke
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: novel
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: smoke-only-password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: novel-studio-smoke
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NOVEL_DATABASE_URL: postgresql+psycopg://novel:smoke-only-password@db:5432/novel
      NOVEL_PUBLIC_URL: https://localhost:8443
      NOVEL_COOKIE_SECURE: "true"
      NOVEL_OPENAI_API_KEY: ""
      PORT: "10000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  tls:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.smoke:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data:
  tls_data:
  tls_config:
