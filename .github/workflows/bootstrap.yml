name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check syntax
        run: python -m compileall -q backend/app backend/scripts
      - name: Import server dependencies
        run: python -c "import agents, sqlalchemy, alembic, psycopg, docx, httpx, pydantic_settings"
      - name: Check Git rules and running server
        run: python backend/scripts/verify_bootstrap.py
      - name: Record installed versions
        run: python -m pip freeze > installed-dependencies.txt
      - name: Upload dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ matrix.os }}
          path: installed-dependencies.txt
