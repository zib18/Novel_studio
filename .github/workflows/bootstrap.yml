name: Novel Studio checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NOVEL_OPENAI_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check syntax
        run: python -m compileall -q backend/app backend/scripts backend/migrations
      - name: Apply durable database migrations
        working-directory: backend
        run: python -m app.cli migrate
      - name: Verify migrations are repeatable
        working-directory: backend
        run: python -m app.cli migrate
      - name: Test database, author decisions and independent pipeline
        working-directory: backend
        run: python -m pytest -q
      - name: Test restart, two sessions, exports and failed generation
        run: python backend/scripts/verify_studio.py
      - name: Check Git rules and real HTTP server
        run: python backend/scripts/verify_bootstrap.py
      - name: Record installed versions
        run: python -m pip freeze > installed-dependencies.txt
      - name: Upload dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ matrix.os }}
          path: installed-dependencies.txt
  frontend:
    name: Editor build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Test offline drafts and synchronization
        working-directory: frontend
        run: npm test -- --run
      - name: Typecheck and build installable web shell
        working-directory: frontend
        run: npm run build
      - name: Upload browser application
        uses: actions/upload-artifact@v4
        with:
          name: novel-studio-web
          path: frontend/dist
  postgres:
    name: PostgreSQL migrations and synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: novel
          POSTGRES_DB: novel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVEL_TEST_DATABASE_URL: postgresql+psycopg://novel:novel@127.0.0.1:5432/novel
      NOVEL_TRANSFER_TEST_DATABASE_URL: postgresql+psycopg://novel:novel@127.0.0.1:5432/novel
      NOVEL_OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Test real server against PostgreSQL
        run: python backend/scripts/verify_studio.py
      - name: Test SQLite transfer into isolated PostgreSQL schemas
        working-directory: backend
        run: python -m pytest tests/test_transfer.py -q
  browser:
    name: Desktop and mobile browser workflow
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOVEL_OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: novel-studio-web
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test editor, mobile synchronization and offline draft
        run: python backend/scripts/verify_browser.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: browser-artifacts

  deployment:
    name: Production container and trusted HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate hosting Blueprint against official schema
        run: |
          python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          python backend/scripts/verify_blueprint.py
      - name: Test production deployment over HTTPS
        run: python backend/scripts/verify_deployment.py
      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: deployment-artifacts
